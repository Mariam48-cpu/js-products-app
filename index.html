<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariam || Online Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/all.css"/>
</head>
<body>

<!-- Cart -->
<div class="cart">
    <div class="top_cart">
        <h3>Cart Item: <span class="count_item_cart">0</span></h3>
        <span onclick="open_close_cart()" class="close_cart"><i class="far fa-times-circle"></i></span>
    </div>
    <div class="items_in_cart" id="cart_items"></div>
    <div class="bottom_cart">
        <div class="total">
            <p class="subtotal">Subtotal</p>
            <p class="price_cart_total">$0</p>
        </div>
        <div class="button_cart">
            <a href="checkout.html" class="btn_cart btn" style="width: 120px;">Checkout</a>
            <span onclick="open_close_cart()" class="btn_car trans_bg btn">Shop More</span>
        </div>
    </div>
</div>

<!-- Header -->
<header>
    <div class="top_header">
        <div class="container" style="background-color: #f6f3f1;">
            <a href="#" class="logo"><img src="images/logo2.jpg" alt="" height="200px" width="200px"/></a>
            <div class="login_signup btns">
                <a href="login.html" class="btn" id="login_btn">Login <i class="fas fa-sign-in-alt"></i></a>
                <span id="welcome" style="display:none; font-weight: bold;"> Hello , <span id="user_name"></span></span>
                <a href="register.html" class="btn">Sign up <i class="fas fa-user-plus"></i></a>
            </div>
        </div>
    </div>
    <div class="bottom_header">
        <div class="container">
            <form action="" class="_box" onsubmit="return false;">
                <div class="search_box d-flex gap-2">
                    <select id="category" name="category">
                        <option value="Search by Product Name">Search by Product Name</option>
                        <option value="Search by category">Search by category</option>
                    </select>
                    <input type="text" id="searchInput" name="search" placeholder="Search..." required/>
                    <button type="submit">Search</button>
                </div>
            </form>
            <div class="header_icons">
                <div class="icon"><a href="#"><i class="far fa-heart"></i><span class="count count_favourit">0</span></a></div>
                <div onclick="open_close_cart()" class="icon"><a href="#"><i class="fas fa-shopping-cart"></i><span class="count count_item_header">0</span></a></div>
            </div>
        </div>
    </div>
</header>

<!-- Products Container -->
<div class="container py-5">
    <div class="row justify-content-center g-5 con">
        <!-- JS سيقوم برسم المنتجات هنا -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
<script src="js/main.js"></script>
<!-- <script src="js/checkout.js"></script> -->
</body>
</html>
