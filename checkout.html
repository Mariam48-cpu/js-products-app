<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariam || Checkout</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="css/all.css"/>
</head>
<body>

<header>
    <div class="top_header">
        <div class="container" style="background-color: #f6f3f1;">
            <a href="index.html" class="logo"><img src="images/logo2.jpg" alt="" height="200px" width="200px"/></a>
            <div class="login_signup btns">
                <!-- <a href="login.html" class="btn" id="login_btn">Login <i class="fas fa-sign-in-alt"></i></a> -->
                <span id="welcome" style="display:none; font-weight:bold;">Hi <span id="user_name"></span></span>
                <div onclick="open_close_cart()" class="icon"><a href="#"><i class="fas fa-shopping-cart"></i><span class="count count_item_header">0</span></a></div>
                <a href="index.html" class="btn log_out">Log Out</a>
            </div>
        </div>
    </div>
</header>

<!-- Cart Products -->
<div class="container mt-5">
    <h2>Cart Items</h2>
    <div class="row cart_products con"></div>
    <h2 class="total_price mt-4">Total Price : $0</h2>
</div>

<!-- Favorite Items -->
<div class="container mt-5">
    <h2 class="favourite_itemes">Favorite Items</h2>
    <div id="favorites_container" class="row scroll d-flex flex-row gap-4 p-2"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
